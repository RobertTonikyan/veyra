<!DOCTYPE html>
<html lang="he">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: the app fills the whole iPhone screen, and safe-area insets work from the first frame -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1A1614" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Veyra" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Veyra</title>
    <style id="expo-reset">
      html, body { height: 100%; margin: 0; background: #1A1614; }
      body { overflow: hidden; overscroll-behavior: none; }
      #root { display: flex; height: 100%; flex: 1; }
      /* installed on the home screen: use the full screen height */
      @media all and (display-mode: standalone) {
        html, body, #root { height: 100vh; }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
