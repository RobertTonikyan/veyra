# Veyra web: the same Expo app, exported as a static single-page site.
[build]
  command = "npx expo export --platform web && node scripts/web-head.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Every path opens the app; Expo Router picks the screen in the browser.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Bundles and fonts have a content hash in their name: cache them for a year.
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
